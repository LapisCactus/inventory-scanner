<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書籍一覧</title>
<style>
body { margin:0; font-family:sans-serif; background:#f5f5f5; }
header { background:#333; color:#fff; padding:12px; text-align:center; display:flex; align-items:center; justify-content:center; position:relative; }
.back-button { position:absolute; left:12px; top:50%; transform:translateY(-50%); background:transparent; border:none; color:#fff; font-size:16px; cursor:pointer; width:auto; padding:0; text-align:left; }
.back-button:hover { opacity:0.8; }
.container { padding:12px; }
.card { background:#fff; margin:8px 0; padding:12px; border-radius:8px; }
#root button { width:100%; padding:14px; margin-top:8px; font-size:16px; }
.meta { font-size:12px; color:#666; }
.missing { color:red; }
</style>
</head>
<body>
<header>
  <button id="backBtn" class="back-button">＜ 戻る</button>
  <div id="title">書籍一覧</div>
</header>
<div class="container" id="root">読み込み中...</div>

<script src="./common.js"></script>
<script id="books_js_001">
(async function init(){
  const shelf = getQuery('shelf');
  if (!shelf) { alert('shelf未指定'); return; }

  const { BOOKS, SHELVES } = await loadBooksCSV();
  const config = await loadConfigCSV();
  const inventory = loadJSON(LS_KEYS.INVENTORY, {});
  const shelfLast = loadJSON(LS_KEYS.SHELF_LAST, {});

  document.getElementById('title').textContent = `書籍一覧：${shelf}`;

  const root = document.getElementById('root');
  root.innerHTML = `
    <button id="scanBtn">棚卸し開始</button>
    <button id="csvBtn">この棚のCSV出力</button>
    <button id="shareBtn">この棚のCSV共有</button>
    <h3>書籍一覧</h3>
  `;

  function buildShelfCodes() {
    return Object.keys(BOOKS)
      .filter(code => getCurrentShelf(code, BOOKS, inventory) === shelf)
      .sort();
  }

  function buildCsvData() {
    const data = [['code', 'name', 'shelf', '◯☓', 'date_seen']];
    buildShelfCodes().forEach(code => {
      const b = BOOKS[code];
      const rec = inventory[code];
      const currentShelf = getCurrentShelf(code, BOOKS, inventory);
      const missing = isMissingForShelf(code, shelf, inventory, shelfLast, config);
      const status = missing ? '☓' : '◯';
      const dateSeen = rec?.lastSeenDate || '-';
      data.push([code, b.title, currentShelf, status, dateSeen]);
    });
    return data;
  }

  document.getElementById('scanBtn').onclick = () => goTo('scan.html', { shelf });
  document.getElementById('csvBtn').onclick = () => {
    const data = buildCsvData();
    const csvContent = '\ufeff' + generateCSV(data);
    const filename = `棚卸し_${shelf}_${todayStr()}.csv`;
    downloadCSV(csvContent, filename);
  };
  document.getElementById('shareBtn').onclick = async () => {
    const data = buildCsvData();
    const csvContent = '\ufeff' + generateCSV(data);
    const filename = `棚卸し_${shelf}_${todayStr()}.csv`;
    const shared = await shareCSV(csvContent, filename, `棚卸し_${shelf}`, 'CSVを共有します');
    if (!shared) {
      alert('共有に対応していない環境のため、CSVをダウンロードしました。');
    }
  };
  document.getElementById('backBtn').onclick = () => goTo('shelf.html');

  const codes = buildShelfCodes();
  if (codes.length === 0) {
    const emptyEl = document.createElement('div');
    emptyEl.className = 'card';
    emptyEl.textContent = 'この棚に現在属する書籍はありません。';
    root.appendChild(emptyEl);
  }

  codes.forEach(code => {
    const b = BOOKS[code];
    const rec = inventory[code];
    const missing = isMissingForShelf(code, shelf, inventory, shelfLast, config);
    const lastSeen = rec?.lastSeenDate || '-';
    const masterLocation = b.location;

    const el = document.createElement('div');
    el.className = 'card ' + (missing ? 'missing' : '');
    el.innerHTML = `
      <div><b>${code}</b></div>
      <div>${b.title}</div>
      <div class="meta">最終確認: ${lastSeen}</div>
      ${masterLocation !== shelf ? `<div class="meta">初期棚: ${masterLocation}</div>` : ''}
    `;
    root.appendChild(el);
  });
})();
</script>
</body>
</html>
