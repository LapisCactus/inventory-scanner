<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>棚卸しスキャナ（CSV対応）</title>
<script src="https://unpkg.com/@zxing/library@latest"></script>

<style>
  body { font-family: sans-serif; text-align: center; padding: 16px; }
  video { width: 100%; max-width: 400px; border: 1px solid #ccc; }
  #resultBox { margin: 16px 0; }
  button { padding: 10px 16px; margin: 8px; font-size: 16px; }

  #modal {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
  }
  #modalContent {
    background: white;
    margin: 10% auto;
    padding: 16px;
    width: 90%;
    max-width: 400px;
    text-align: left;
  }
  .found { color: green; }
  .unknown { color: gray; }
</style>
</head>

<body>

<h2>棚卸しスキャナ</h2>

<div id="loading">マスタ読み込み中...</div>

<video id="video" style="display:none;"></video>

<div id="status"></div>
<div id="resultBox"></div>

<div>
  <button id="registerBtn" style="display:none;">登録</button>
  <button id="skipBtn" style="display:none;">登録せず次へ</button>
  <button id="showStatusBtn" style="display:none;">棚卸し状況</button>
</div>

<!-- モーダル -->
<div id="modal">
  <div id="modalContent">
    <h3>棚卸し状況</h3>
    <div id="inventoryList"></div>
    <button onclick="closeModal()">✕ 閉じる</button>
  </div>
</div>

<script>
/* ========================
   フォールバックデータ
======================== */
const FALLBACK_BOOKS = {
  "C000": { title: "サンプル本", location: "不明" }
};

/* ========================
   グローバル状態
======================== */
let BOOKS = {};
let inventoryState = {};

const codeReader = new ZXing.BrowserMultiFormatReader();

const video = document.getElementById("video");
const status = document.getElementById("status");
const resultBox = document.getElementById("resultBox");
const loading = document.getElementById("loading");

const registerBtn = document.getElementById("registerBtn");
const skipBtn = document.getElementById("skipBtn");
const showStatusBtn = document.getElementById("showStatusBtn");

let currentCode = null;

/* ========================
   CSV読み込み
======================== */
async function loadCSV() {
  const res = await fetch('./books.csv');
  if (!res.ok) throw new Error("fetch失敗");

  const text = await res.text();
  const lines = text.trim().split('\n');

  const books = {};

  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');

    const code = cols[0]?.trim();
    const title = cols[1]?.trim();
    const location = cols[2]?.trim();

    if (!code) continue;

    books[code] = { title, location };
  }

  return books;
}

/* ========================
   初期化
======================== */
async function init() {
  try {
    BOOKS = await loadCSV();
  } catch (e) {
    alert("CSV読み込み失敗。フォールバックで起動します");
    BOOKS = FALLBACK_BOOKS;
  }

  // 状態初期化
  Object.keys(BOOKS).forEach(code => {
    inventoryState[code] = "未調査";
  });

  loading.style.display = "none";
  video.style.display = "block";

  startScan();
}

/* ========================
   スキャン
======================== */
function startScan() {
  status.textContent = "読み取り中...";
  resultBox.innerHTML = "";
  currentCode = null;

  registerBtn.style.display = "none";
  skipBtn.style.display = "none";
  showStatusBtn.style.display = "none";

  codeReader.decodeFromVideoDevice(null, video, (result, err) => {
    if (result) {
      codeReader.reset();
      handleScan(result.getText());
    }
  });
}

function handleScan(code) {
  currentCode = code;

  const book = BOOKS[code];

  status.textContent = "読み取り完了";

  if (book) {
    resultBox.innerHTML = `
      <div><b>コード:</b> ${code}</div>
      <div><b>書名:</b> ${book.title}</div>
      <div><b>所在:</b> ${book.location}</div>
    `;
  } else {
    resultBox.innerHTML = `
      <div><b>コード:</b> ${code}</div>
      <div style="color:red;">未登録のコード</div>
    `;
  }

  registerBtn.style.display = "inline-block";
  skipBtn.style.display = "inline-block";
  showStatusBtn.style.display = "inline-block";
}

/* ========================
   ボタン処理
======================== */
registerBtn.addEventListener("click", () => {
  if (currentCode && BOOKS[currentCode]) {
    inventoryState[currentCode] = "ある";
  }
  startScan();
});

skipBtn.addEventListener("click", () => {
  startScan();
});

showStatusBtn.addEventListener("click", () => {
  const list = document.getElementById("inventoryList");
  list.innerHTML = "";

  Object.keys(BOOKS).forEach(code => {
    const b = BOOKS[code];
    const state = inventoryState[code];
    const cls = state === "ある" ? "found" : "unknown";

    list.innerHTML += `
      <div class="${cls}">
        ${code} : ${b.title} (${b.location}) → ${state}
      </div>
    `;
  });

  document.getElementById("modal").style.display = "block";
});

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* ========================
   起動
======================== */
init();

</script>

</body>
</html>
