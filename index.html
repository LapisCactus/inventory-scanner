<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>バーコード棚卸しシステム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      background-color: #f7f9fc;
      color: #333;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1, h2 {
      margin-top: 0;
    }
    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .button {
      display: inline-block;
      padding: 12px 18px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }
    .button.secondary {
      background: #95a5a6;
    }
    footer {
      text-align: center;
      font-size: 12px;
      color: #888;
      padding: 20px;
    }
  </style>
</head>
<body>

<header>
  <h1>バーコード棚卸しシステム</h1>
</header>

<main>

  <div class="card">
    <h2>このシステムの目的</h2>
    <p>
      図書や物品に付与されたバーコードを使い、棚ごとの所在を簡単に記録・管理するためのシステムです。
    </p>
    <ul>
      <li>どの棚に何があるかを明確にする</li>
      <li>棚卸し作業を効率化する</li>
      <li>CSVベースでシンプルにデータ管理</li>
    </ul>
  </div>

  <div class="card">
    <h2>使い方（基本フロー）</h2>
    <ol>
      <li>棚を選択する</li>
      <li>バーコードをスキャンする</li>
      <li>データを保存する</li>
    </ol>
    <p>
      スキャン結果はCSVとして管理され、後から確認・編集できます。
    </p>
  </div>

  <div class="card">
    <h2>メニュー</h2>
    <div class="buttons">
      <a href="shelf.html" class="button">棚一覧へ</a>
      <button class="button secondary" onclick="clearInventory()">棚卸し状態をクリア</button>
    </div>
  </div>

</main>

<footer>
  © 2026 Inventory System
</footer>

<script src="common.js"></script>

</body>
</html>
